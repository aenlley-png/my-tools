name: Deploy Anomaly Detector to Cloudflare

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [main]
    paths:
      - 'anomaly-worker.js'
      - 'anomaly-schema.sql'
      - 'wrangler-anomaly.toml'
      - 'tools/deploy.sh'
      - 'plugin/v5-stock-plugin/**'

permissions:
  contents: write           # 允许把更新后的 wrangler-anomaly.toml 提交回去

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm i -g wrangler@4

      - name: Run deploy.sh
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          chmod +x tools/deploy.sh
          bash tools/deploy.sh

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-stock-plugin
          path: |
            dist/v5-stock-plugin.zip
            dist/v5-stock-plugin/
            dist/DEPLOY_INFO.txt
          retention-days: 30

      - name: Print deploy info
        if: always()
        run: |
          echo "════════════════════════════════════════"
          if [ -f dist/DEPLOY_INFO.txt ]; then cat dist/DEPLOY_INFO.txt; fi
          echo "════════════════════════════════════════"

      - name: Commit updated wrangler-anomaly.toml
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler-anomaly.toml
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist deployed D1/KV ids [skip ci]"
            git push
          fi
